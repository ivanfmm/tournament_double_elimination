# SOLO PARA CLASE: misma contrasena que docker-compose.yml.
# En un proyecto real el secret no vive en Git (se crea aparte o con
# un gestor de secretos).
apiVersion: v1
kind: Secret
metadata:
  name: db
type: Opaque
stringData:
  POSTGRES_PASSWORD: password
  ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=tournament_db;Username=tournament_svc;Password=password
