apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          # Marcador: scripts/deploy.sh pone la imagen real (git-<sha>)
          # con kubectl set image. Nunca se usa :latest.
          image: localhost:5000/tournament-api:sin-desplegar
          ports:
            - containerPort: 8080
          env:
            - name: ConnectionStrings__Default
              valueFrom:
                secretKeyRef:
                  name: db
                  key: ConnectionStrings__Default
          # readiness: el pod recibe trafico solo si la base responde
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
          # liveness: si el proceso se cuelga, Kubernetes lo reinicia
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8080
