# En dev la API corre como Development (habilita /openapi/v1.json).
# El merge es por nombre de variable: ConnectionStrings__Default se conserva.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
