# Valores de Helm para el chart traefik/traefik.
# OJO: esto NO se aplica con kubectl, se pasa a `helm upgrade --install --values`.
ingressClass:
  enabled: true
  name: traefik
  isDefaultClass: false

providers:
  kubernetesIngress:
    enabled: true

# En el chart traefik/traefik 41.7.x el tipo del Service va en service.spec.type
# (service.type se ignora). El nodePort lo fija ports.web.nodePort (30081).
service:
  spec:
    type: NodePort

ports:
  web:
    port: 8000
    exposedPort: 80
    nodePort: 30081
    expose:
      default: true
  websecure:
    expose:
      default: false

ingressRoute:
  dashboard:
    enabled: false
